[project]
name = "agents-brownbag-code-burst"
version = "0.1.0"
description = "LangGraph pattern snippets and a coding agent: examples for the custom agents code burst"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.6.7",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.9.6,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
