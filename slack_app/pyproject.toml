[project]
name = "funding-watch"
version = "0.1.0"
description = "NIH funding watch: route new NIH opportunities to research groups and post them to Slack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "langchain-core>=1.6.7",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "slack-bolt>=1.21",
    "slack-sdk>=3.46.0",
]

[project.scripts]
funding-watch = "funding_watch.cli:main"

[build-system]
requires = ["uv_build>=0.9.6,<0.10"]
build-backend = "uv_build"
